spring.config.activate.on-profile=!test
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

#---
spring.application.name=mentora

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:20}

server.port=${SERVER_PORT:8080}
